# ============================================================
# 应用日志配置
# ============================================================
# 日志固定写到仓库根目录 log/。
# 每次启动按“月-日-时-分-count.log”创建文件；同一次启动超过上限时仅递增 count。

logging:
  # DEBUG / INFO / WARNING / ERROR / CRITICAL
  level: INFO

  # 单文件上限，允许 1 到 10；代码强制不超过 10 MB。
  max_file_size_mb: 10

  # 是否同时输出到控制台。
  console_enabled: true
