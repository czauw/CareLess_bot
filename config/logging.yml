# ============================================================
# 应用日志配置
# ============================================================
# 日志固定写到仓库根目录 log/careless-bot.log。
# 单个日志文件最大 10 MB，达到上限后轮转为 .log.1、.log.2 等备份文件。

logging:
  # DEBUG / INFO / WARNING / ERROR / CRITICAL
  level: INFO

  # 单文件上限，允许 1 到 10；代码强制不超过 10 MB。
  max_file_size_mb: 10

  # 保留的历史轮转文件数量，允许 1 到 30。
  backup_count: 5

  # 是否同时输出到控制台。
  console_enabled: true
