# ============================================================
# 群聊人格参数（可选覆盖环境变量中的默认值）
# ============================================================
# 此文件用于更细粒度的人格调整，MVP 阶段可选。
# 未指定的项将使用 config.py 中的默认值。

persona:
  # 基础主动概率（候选消息的 2%）
  active_probability: 0.02

  # 冷却（秒）
  group_cooldown_seconds: 600
  user_cooldown_seconds: 1200

  # 每小时最大主动回复数
  max_active_replies_per_hour: 3

  # 回复最大长度（汉字）
  max_reply_length: 80

  # 夜间静默时段（时区由 TIMEZONE 决定）
  quiet_start: "00:30"
  quiet_end: "07:30"

  # 机器人自述（被问到身份时）
  self_description: "我是群里的机器人，帮忙看服务器、偶尔接个话。"
