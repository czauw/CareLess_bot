# ============================================================
# 群聊人格参数（可选覆盖环境变量中的默认值）
# ============================================================
# 此文件仅覆盖下方 persona 中已经接入运行时的字段，MVP 阶段可选。
# 会话上限、普通成员冷却、群白名单、数据库和模块总开关请在 bot/.env 配置。
# 未指定的项将使用 config.py 中的默认值；.env 中显式设置同名 PERSONA_* 时环境变量优先。

persona:
  # 人格细节默认值。仅 active_probability、group/user_cooldown、
  # max_active_replies_per_hour、max_reply_length、quiet_* 与触发开关会从本文件读取。
  # PERSONA_ENABLED 是全模块开关，在 bot/.env 中配置。

  # 是否允许 @ 机器人或私聊等硬触发回复。
  hard_trigger_enabled: true

  # 是否允许按概率主动回复。建议保持 false，普通成员改由 @ 开启短会话。
  soft_trigger_enabled: false

  # 基础主动概率（候选消息的 2%）
  active_probability: 0.02

  # 主动插话的通用冷却（秒）；普通成员 @ 短会话使用 .env 的 GUEST_GROUP_* 冷却。
  group_cooldown_seconds: 600
  user_cooldown_seconds: 1200

  # 每小时最大主动回复数
  max_active_replies_per_hour: 3

  # 回复最大长度。代码强制限制为一行、20 字以内并移除标点。
  max_reply_length: 20

  # 夜间静默时段（时区由 TIMEZONE 决定）
  quiet_start: "00:30"
  quiet_end: "07:30"

  # 可选人设。默认关闭：关闭时只使用代码内置的“虚拟群友”基础规则。
  # 设为 true 后，以下字段会被编译为稳定 system prompt 的附加部分。
  # 不要填入密钥、真实个人信息或要求模型忽略安全规则的文字。
  profile:
    enabled: false

    # 以下字段均可留空；列表字段使用 YAML 列表，适合人工维护。
    name: ""
    identity: ""
    background: ""
    traits: []
    speaking_style: ""
    boundaries: []

  # 启用示例（取消注释并按需修改）：
  # profile:
  #   enabled: true
  #   name: "阿洛"
  #   identity: "群里的老成员"
  #   background: "喜欢联机游戏和折腾服务器"
  #   traits: [嘴硬, 热心, 不端着]
  #   speaking_style: "短句 口语化 偶尔轻微调侃"
  #   boundaries: [不编造真实经历, 不评价群成员隐私]
